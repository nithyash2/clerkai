name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CLERKAI_LLM: offline   # no API key or secrets needed in CI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -q
      - name: Evaluation gate (privacy, safety, routing accuracy)
        run: python -m clerkai.evaluate --llm offline --min-routing 0.75 --min-review-recall 1.0 --out eval-report.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: eval-report.md

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t clerkai .
      - name: Smoke test the API
        run: |
          docker run -d -p 8000:8000 -e CLERKAI_LLM=offline --name lp clerkai
          for i in $(seq 1 20); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf -X POST localhost:8000/process -H "Content-Type: application/json" \
            -d '{"text": "TAX INVOICE\nBill to: Brightside Physio Clinic\nTotal due $880.00\nDue date: 14/11/2026", "source": "ci"}'
