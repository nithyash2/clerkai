[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clerkai"
version = "0.2.0"
description = "An AI agent that triages an accounting firm's shared inbox"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "google-genai>=1.0",
    "pypdf>=4.0",
    "fastapi>=0.110",
    "python-multipart>=0.0.9",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
ui = ["streamlit>=1.35", "pandas>=2.0"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
